# Profile, positioning and capabilities.
# `careerStart` drives the "years of experience" figure shown on the site.
- profile:
    initials: RF
    fname: Reti
    lname: Fier
    profession: Senior Full-Stack / Product Engineer
    headline: Engineering software from architecture to production.
    intro: >-
      I design, build and run complete products: SaaS platforms, AI-powered
      applications and the backend systems behind them, from architecture and
      APIs to deployment and long-term maintenance.
    resumeSummary: >-
      Full-stack engineer with 7+ years of experience designing, building,
      deploying and maintaining SaaS platforms and production applications.
      Takes features from system design, APIs, databases and integrations
      through product interfaces to deployment and long-term maintenance.
      Recent work covers Stripe payments and subscription billing, AI-powered
      features and automation, and backend systems for a multi-country data
      platform, alongside Kanonara, a live AI-assisted writing platform built
      and operated independently. Works independently or within product
      teams, mainly with TypeScript, React, Next.js, Node.js, PostgreSQL and
      MongoDB.
    careerStart: "2019-08"
    image: images/icon.png
    email: dev.retifier@gmail.com
    availability: Open to full-time and contract engineering roles
    focus:
      - SaaS platforms
      - System design & APIs
      - AI features & automation
      - Payments & subscriptions
    education:
      - qualification: BSc (Top-Up) in Computer Science
        institution: University of Roehampton, London
    about:
      - >-
        I'm a full-stack engineer with more than seven years of experience
        designing, building and running SaaS platforms, AI-powered products and
        the backend systems behind them. Most of my work sits where product requirements
        meet system design: how the data should be modeled, where a boundary
        belongs, and what has to stay true for a feature to keep working long
        after launch.
      - >-
        I work across the whole lifecycle: architecture, APIs and data models,
        the interfaces people actually use, and the deployment, debugging and
        maintenance that come after. Along the way that has meant an AI content
        platform, blockchain treasury tooling, financial data pipelines, a
        point-of-sale system and, today, independent contract work on SaaS
        products: payments and subscription billing, business-management
        tools, and backend systems for a multi-country data platform. I'm as
        comfortable owning a product on my own as I am working inside a team.
      - >-
        Outside client work I build my own products end to end. Kanonara is a
        long-form writing platform where AI analysis assists authors without
        ever silently changing their story. Synthetic Instinct is a trading
        research system built around execution safety, risk controls and
        honest evaluation. Both are deliberate exercises in the engineering I
        care about most: explicit boundaries, careful failure handling, and
        systems that are still easy to reason about a year later.
    principles:
      - title: Model the problem first
        text: >-
          Architecture starts with the domain: the data, the workflows and the
          ways they fail. The stack follows from that, not the other way round.
      - title: Design for the second year
        text: >-
          Code is changed far more often than it is written. Clear boundaries,
          typed contracts and tests that pin behavior keep the next change cheap.
      - title: Own it in production
        text: >-
          Shipping is the midpoint. Deployment, debugging and maintenance are
          part of the work, and I plan for them from the first commit.
      - title: Make AI earn its place
        text: >-
          AI features get the same discipline as any other dependency: bounded
          inputs, fallbacks, and a person in control of anything that matters.
    skillGroups:
      - title: Frontend Engineering
        summary: >-
          Product interfaces that stay fast and maintainable as features pile up,
          from server-rendered web apps to React Native mobile.
        practice:
          - User-facing applications for an AI content platform at deal.ai
          - Author workspace, reader and admin console for Kanonara
          - Interfaces built from Figma designs, plus React Native apps for Android
        items:
          - React
          - Next.js
          - TypeScript
          - JavaScript
          - Tailwind CSS
          - Redux
          - React Native
          - Gatsby
      - title: Backend Engineering
        summary: >-
          APIs and services with explicit contracts, sensible module boundaries
          and behavior that is pinned by tests.
        practice:
          - Fastify API organized as feature modules with typed request schemas
          - Node.js and Express services behind AI and financial data products
          - Real-time and event-driven work over WebSockets and bots
        items:
          - Node.js
          - Fastify
          - Express.js
          - REST APIs
          - GraphQL
          - Zod
          - WebSockets / Socket.IO
          - System design
      - title: Databases & Data
        summary: >-
          Data models shaped around how a product evolves, plus the pipelines
          that collect, clean and serve the data.
        practice:
          - Relational story models with history and SQL migrations (PostgreSQL, Drizzle)
          - Document models for platform, trading and treasury data (MongoDB)
          - Scraping pipelines over public financial data
        items:
          - PostgreSQL
          - MongoDB
          - Mongoose
          - Drizzle ORM
          - Redis
          - Supabase
          - Database modeling
      - title: Infrastructure & Delivery
        summary: >-
          Getting software into production and keeping it healthy: containers,
          automated checks, deployment and the maintenance that follows.
        practice:
          - CI pipelines that run type checks, tests and deploys on every merge
          - Containerized services deployed to managed platforms
          - Unit, contract and browser end-to-end test suites
        items:
          - Docker
          - GitHub Actions
          - Fly.io
          - Vercel
          - Jest
          - Vitest
          - Playwright
          - Git
      - title: Specialized Engineering
        summary: >-
          Domains where correctness and failure handling matter more than usual.
        practice:
          - Stripe payments, subscription management and billing workflows
          - LLM extraction with model routing and fallback chains
          - Exchange integration, risk controls and backtesting for crypto futures
          - On-chain monitoring, airdrop automation and notification bots
        items:
          - Stripe payments & subscriptions
          - AI integrations
          - OpenRouter
          - Automation & bots
          - CCXT / exchange APIs
          - Web3.js
          - Ethers.js
